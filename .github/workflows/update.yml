name: Update profile

# Rebuilds the neofetch card (card-dark.svg / card-light.svg) from live GitHub stats
# and the PM Skills feeds, and regenerates the contribution snake on the `output`
# branch. Daily, on push, or by hand.
on:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the card and the case study
        run: node scripts/build-card.mjs && node scripts/build-cards.mjs && node scripts/build-visuals.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a fine-grained PAT with read access to pm-claude-skills (Administration:
          # read-only unlocks the traffic API for the funnel card). Without it the funnel keeps
          # the last snapshot and says so.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card-dark.svg card-light.svg repo-*.svg tagline-*.svg cs-*.svg vis-*.svg social-card-*.svg data/history.json
          git diff --cached --quiet && echo "nothing changed" || (git commit -m "cards: daily refresh" && git push)

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
