<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" role="img" aria-label="Now / Next / Later / Never">
<rect x="0.5" y="0.5" width="759" height="371" rx="12" fill="#0d1117" stroke="#30363d"/>
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="24" y="30" font-size="11" letter-spacing="1.5" fill="#8b949e">ROADMAP · FROM ROADMAP.MD, EXCEPT THE LAST COLUMN</text>
<text x="24" y="54" font-size="19" font-weight="700" fill="#d2a8ff">Now / Next / Later / Never</text>
<line x1="24" y1="66" x2="736" y2="66" stroke="#21262d"/>
<text x="24" y="92" font-size="11" fill="#3fb950" font-weight="700">NOW</text>
<text x="24" y="112" font-size="12" fill="#c9d1d9">Proving what is here.</text>
<text x="24" y="128" font-size="12" fill="#c9d1d9">The library has 1176</text>
<text x="24" y="144" font-size="12" fill="#c9d1d9">skills. Of those, 281</text>
<text x="24" y="160" font-size="12" fill="#c9d1d9">have a curated eval case…</text>
<text x="24" y="182" font-size="12" fill="#c9d1d9">Trust in a release.</text>
<text x="24" y="198" font-size="12" fill="#c9d1d9">Checking that every</text>
<text x="24" y="214" font-size="12" fill="#c9d1d9">release installs and</text>
<text x="24" y="230" font-size="12" fill="#c9d1d9">runs, a way to tell…</text>
<text x="24" y="252" font-size="12" fill="#c9d1d9">Per-skill depth.</text>
<text x="24" y="268" font-size="12" fill="#c9d1d9">references/ exist for</text>
<text x="24" y="284" font-size="12" fill="#c9d1d9">114 of them, templates/</text>
<text x="24" y="300" font-size="12" fill="#c9d1d9">for 51 and helper…</text>
<text x="204" y="92" font-size="11" fill="#58a6ff" font-weight="700">NEXT</text>
<text x="204" y="112" font-size="12" fill="#c9d1d9">A promotion round for</text>
<text x="204" y="128" font-size="12" fill="#c9d1d9">Production-Ready. 59 are</text>
<text x="204" y="144" font-size="12" fill="#c9d1d9">promoted today. The tier</text>
<text x="204" y="160" font-size="12" fill="#c9d1d9">ladder needs a promotion…</text>
<text x="204" y="182" font-size="12" fill="#c9d1d9">Paying down the web</text>
<text x="204" y="198" font-size="12" fill="#c9d1d9">design debt. The</text>
<text x="204" y="214" font-size="12" fill="#c9d1d9">stylesheet has more</text>
<text x="204" y="230" font-size="12" fill="#c9d1d9">sizes, radii and colours…</text>
<text x="204" y="252" font-size="12" fill="#c9d1d9">Fixing the accessibility</text>
<text x="204" y="268" font-size="12" fill="#c9d1d9">failures on the router</text>
<text x="204" y="284" font-size="12" fill="#c9d1d9">and catalogue pages,</text>
<text x="204" y="300" font-size="12" fill="#c9d1d9">which fail the check on…</text>
<text x="204" y="322" font-size="12" fill="#c9d1d9">More export and install</text>
<text x="204" y="338" font-size="12" fill="#c9d1d9">targets as the SKILL.md</text>
<text x="204" y="354" font-size="12" fill="#c9d1d9">standard spreads.</text>
<text x="384" y="92" font-size="11" fill="#d29922" font-weight="700">LATER</text>
<text x="384" y="112" font-size="12" fill="#c9d1d9">Translated skill</text>
<text x="384" y="128" font-size="12" fill="#c9d1d9">descriptions. Currently</text>
<text x="384" y="144" font-size="12" fill="#c9d1d9">a stub: 11 Spanish, 10</text>
<text x="384" y="160" font-size="12" fill="#c9d1d9">Japanese, 10 Chinese and…</text>
<text x="384" y="182" font-size="12" fill="#c9d1d9">Pinning from the CLI, so</text>
<text x="384" y="198" font-size="12" fill="#c9d1d9">that a team can install</text>
<text x="384" y="214" font-size="12" fill="#c9d1d9">one skill at one version</text>
<text x="384" y="230" font-size="12" fill="#c9d1d9">with a single command.</text>
<text x="564" y="92" font-size="11" fill="#f85149" font-weight="700">NEVER</text>
<text x="564" y="112" font-size="12" fill="#c9d1d9">a Discord</text>
<text x="564" y="134" font-size="12" fill="#c9d1d9">a token</text>
<text x="564" y="156" font-size="12" fill="#c9d1d9">a rebrand to "PM Skills</text>
<text x="564" y="172" font-size="12" fill="#c9d1d9">AI"</text>
<text x="564" y="194" font-size="12" fill="#c9d1d9">a skill that says "it</text>
<text x="564" y="210" font-size="12" fill="#c9d1d9">depends"</text>
<text x="736" y="358" text-anchor="end" font-size="11" fill="#8b949e">never is load-bearing</text>
</g></svg>
