<text x="36" y="202" font-size="13" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ npx pm-claude-skills add figma-design-qa</text>
<text x="736" y="286" text-anchor="end" font-size="11" fill="#8b949e">one of the library's skills, launched again like it's new</text>
