<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Introducing Writing Great Skills">
<rect x="0.5" y="0.5" width="759" height="299" rx="12" fill="#0d1117" stroke="#30363d"/>
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="24" y="30" font-size="11" letter-spacing="1.5" fill="#8b949e">LAUNCH POST · REGENERATED EVERY MORNING · 2026-10-14</text>
<text x="24" y="54" font-size="19" font-weight="700" fill="#d2a8ff">Introducing Writing Great Skills</text>
<line x1="24" y1="66" x2="736" y2="66" stroke="#21262d"/>
<text x="24" y="92" font-size="14" fill="#c9d1d9">Author a high-quality Agent Skill (SKILL.md) that an AI reliably triggers and</text>
<text x="24" y="112" font-size="14" fill="#c9d1d9">executes well — strong frontmatter, a sharp description with trigger phrases, a</text>
<text x="24" y="132" font-size="14" fill="#c9d1d9">clear output contract, quality checks, and anti-patterns.</text>
<text x="24" y="158" font-size="11" fill="#8b949e">WHO IT'S FOR</text>
<text x="24" y="176" font-size="13" fill="#c9d1d9">anyone who would say: asked to write a skill, create a SKILL</text>
<text x="24" y="200" font-size="11" fill="#8b949e">INSTALL</text>
<rect x="24" y="205" width="712" height="28" rx="6" fill="#161b22" stroke="#21262d"/>
<text x="36" y="224" font-size="13" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ npx pm-claude-skills add writing-great-skills</text>
<text x="736" y="286" text-anchor="end" font-size="11" fill="#8b949e">one of the library's skills, launched again like it's new</text>
</g></svg>
