<text x="24" y="54" font-size="19" font-weight="700" fill="#d2a8ff">Introducing Figma Design QA</text>
<line x1="24" y1="66" x2="736" y2="66" stroke="#21262d"/>
<text x="24" y="92" font-size="14" fill="#c9d1d9">Runs a pre-handoff QA checklist on a Figma design before it goes to engineering.</text>
<text x="24" y="118" font-size="11" fill="#8b949e">WHO IT'S FOR</text>
<text x="24" y="136" font-size="13" fill="#c9d1d9">anyone who would say: asked to QA a Figma design, do a pre-handoff check, or</text>
<text x="24" y="154" font-size="13" fill="#c9d1d9">validate a Figma file is ready to build</text>
<text x="24" y="178" font-size="11" fill="#8b949e">INSTALL</text>
